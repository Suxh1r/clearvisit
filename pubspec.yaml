name: clearvisit
description: A private, local-first medical visit organizer.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.0.0
  flutter_secure_storage: ^10.3.1
  flutter_timezone: ^4.0.0
  local_auth: ^3.0.1
  path: ^1.9.1
  path_provider: ^2.1.6
  sqflite_sqlcipher: ^3.4.0
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

